[pytest]
testpaths = tests
pythonpath = .
markers =
    postgres: isolated PostgreSQL database integration tests (requires TEST_DATABASE_URL)
    engines: real Valhalla and native VROOM tests (requires RUN_ENGINE_TESTS=1)
    worker: Linux worker/real-engine/process recovery tests (requires RUN_WORKER_TESTS=1 and TEST_DATABASE_URL)
    database_ops: isolated role/backup/restore tests requiring Docker Compose and a bootstrap PostgreSQL role (RUN_DATABASE_OPS_TESTS=1)
