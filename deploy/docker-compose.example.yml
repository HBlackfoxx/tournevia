name: tournevia-community

x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

# Base stack. The road router runs separately, or inside the stack with
# docker-compose.routing.yml; see deploy/README.md and deploy/SETTINGS.md.
x-app-environment: &app-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-vrp}
  DB_USER: ${RUNTIME_DB_USER:-vrp_app}
  DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}
  APP_MODE: ${APP_MODE:-local}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
  MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
  VALHALLA_URL: ${VALHALLA_URL:-http://host.docker.internal:8002}
  ROUTING_DATASET: ${ROUTING_DATASET:-Geofabrik Ile-de-France downloaded 2026-09-22; static OSM speeds}
  GEOCODER_URL: ${GEOCODER_URL:-}
  GEOCODER_DATASET: ${GEOCODER_DATASET:-Base Adresse Nationale (Licence Ouverte 2.0)}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-180}
  MATRIX_CONCURRENCY: ${MATRIX_CONCURRENCY:-1}
  MATRIX_MAX_KM: ${MATRIX_MAX_KM:-200}

services:
  postgres:
    image: postgres:16-alpine@sha256:23e88eb049fd5d54894d70100df61d38a49ed97909263f79d4ff4c30a5d5fca2
    logging: *bounded-logging
    # SQL errors can contain record values; application logs retain safe error classes.
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_min_messages=fatal"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vrp}
      POSTGRES_USER: ${POSTGRES_USER:-vrp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    # The image's entrypoint drops to the postgres user itself; it needs no new privileges.
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256

  setup:
    image: tournevia-app:local
    logging: *bounded-logging
    build:
      context: ..
      target: runtime
    environment:
      <<: *app-environment
      POSTGRES_USER: ${POSTGRES_USER:-vrp_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:-vrp_app}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-vrp_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    command: ["python", "-m", "app.setup_database"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777

  worker:
    image: tournevia-app:local
    logging: *bounded-logging
    command: ["python", "-m", "app.worker"]
    environment: *app-environment
    depends_on:
      setup:
        condition: service_completed_successfully
    # Restarts after crashes and host reboots; an explicit stop is respected.
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=96m,mode=1777
    # The worker touches this file on every database guard check, working or idle.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/vrp-worker-alive') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    image: tournevia-app:local
    logging: *bounded-logging
    build:
      context: ..
      target: runtime
    environment:
      <<: *app-environment
      BIND_HOST: "0.0.0.0"
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      MONITOR_TOKEN: ${MONITOR_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 6

volumes:
  postgres-data: {}
