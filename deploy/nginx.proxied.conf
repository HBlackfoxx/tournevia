worker_processes 1;
pid /tmp/nginx.pid;
# Raw runtime error logs may echo private request URIs. Status/timing logs below
# and the app's safe error codes provide diagnostics; nginx -t checks startup.
error_log /dev/null;
events { worker_connections 256; }
http {
    log_format safe '$time_iso8601 status=$status elapsed=$request_time bytes=$body_bytes_sent upstream=$upstream_status request_id=$upstream_http_x_request_id';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    server_tokens off;
    # The operator's HTTPS proxy terminates TLS and connects from a private container
    # address. It must replace any client-sent X-Forwarded-For with the visitor's address
    # or append it (Traefik and Caddy replace it by default; nginx's $proxy_add_x_forwarded_for
    # appends): the last entry is the visitor. This server publishes no host port, so only
    # containers on its networks can connect and set that header.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    # Sign-in attempts per visitor address; other requests are not limited here.
    # The application also limits failures per username and client.
    map $request_method $signin_address { POST $binary_remote_addr; default ""; }
    limit_req_zone $signin_address zone=signin:1m rate=20r/m;
    limit_req_status 429;
    server {
        listen 8080;
        server_name _;
        # The application sets these too; hide its copies so every response, including
        # nginx's own errors such as 429 and 502, carries each header exactly once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Browsers reach this server only through the operator's HTTPS proxy.
        add_header Strict-Transport-Security "max-age=15552000" always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        # Replaces any client-sent value with the visitor address; used only for sign-in throttling.
        proxy_set_header X-VRP-Client $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Errors nginx raises itself answer in the application's JSON shape, so the interface
        # can explain them. These locations add no headers: they inherit the ones above.
        # A location with its own error_page replaces this list, so each one repeats 413.
        error_page 413 @too_large;
        location @too_large {
            default_type application/json;
            return 413 '{"code":"REQUEST_TOO_LARGE","detail":"Request body limit is 1 MiB."}';
        }
        location @signin_limited {
            default_type application/json;
            return 429 '{"code":"SIGNIN_RATE_LIMITED","detail":"Too many sign-in attempts from this address. Wait a minute, then try again."}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"code":"SERVICE_UNAVAILABLE","detail":"The planning service is not responding. Try again in a moment."}';
        }
        # tournevia-api is the API's alias on this installation's own network; the shorter
        # service name could also match a container on the shared proxy network.
        location = /api/v1/session {
            limit_req zone=signin burst=10 nodelay;
            error_page 413 @too_large;
            error_page 429 @signin_limited;
            error_page 502 503 504 =503 @unavailable;
            proxy_pass http://tournevia-api:8000;
        }
        location /api/ {
            error_page 413 @too_large;
            error_page 502 503 504 =503 @unavailable;
            proxy_pass http://tournevia-api:8000;
        }
        location / {
            proxy_pass http://tournevia-api:8000;
        }
    }
}
