# Runs when a version tag (v0.8.0) is pushed: makes the source kit, builds the application
# image from the extracted kit as an operator would, runs the HTTPS installation acceptance
# on that image, publishes it to the GitHub container registry and opens a GitHub release
# holding the kit, its checksum and the bills of materials. A manual run on a branch
# rehearses everything except the two publishing steps. See deploy/RELEASE.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Version from the application; a tag must name it and the changelog must describe it
        run: |
          version=$(python -c "import json; print(json.load(open('web/package.json'))['version'])")
          test "$version" = "$(python -c "import json; print(json.load(open('backend/openapi.json'))['info']['version'])")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/release.py notes --version "$version" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Source kit from this commit
        run: python scripts/release.py pack --version "$VERSION" --output "$RUNNER_TEMP/kit"
      - name: Verify and build the extracted kit
        run: |
          unzip -q "$RUNNER_TEMP"/kit/*.zip -d "$RUNNER_TEMP/extracted"
          kit=$(echo "$RUNNER_TEMP"/extracted/tournevia-*)
          (cd "$kit" && python scripts/release.py verify && python scripts/release.py build)
          echo "KIT=$kit" >> "$GITHUB_ENV"
          echo "IMAGE=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['image'])" "$kit/deploy/runtime/release-image.json")" >> "$GITHUB_ENV"
      - name: HTTPS installation acceptance on the built image
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python scripts/test_https.py --image "$IMAGE"
      - name: Publish the image to the GitHub container registry
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          published="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tournevia-app:$VERSION"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$published"
          docker push "$published"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$published")
          printf '\n### Container image\n\n`%s`, or by digest `%s`.\n' "$published" "$digest" >> "$RUNNER_TEMP/notes.md"
      - name: GitHub release with the kit, its checksum and the bills of materials
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tournevia Community $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" $(case "$VERSION" in *-*) echo --prerelease ;; esac) \
            "$RUNNER_TEMP"/kit/* "$KIT"/deploy/runtime/sbom/*.json
